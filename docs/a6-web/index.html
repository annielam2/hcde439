<!-- Tell the browser this file is HTML -->
<!DOCTYPE html>
<!-- Start the page, written in English -->
<html lang="en">
  <!-- The head holds settings and the scripts the page needs -->
  <head>
    <!-- Use UTF-8 text encoding -->
    <meta charset="utf-8" />
    <!-- Make the page fit phone and laptop screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Title shown in the browser tab -->
    <title>A6: Firefly Jar</title>
    <!-- Remove the default margin and scrollbars so the canvas fills the window -->
    <style>body { margin: 0; overflow: hidden; background: #0a0f28; }</style>
    <!-- Load the p5.js drawing library -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
    <!-- Load p5.webserial, which wraps the browser's Web Serial API for p5 -->
    <script src="https://unpkg.com/@gohai/p5.webserial@^1/libraries/p5.webserial.js"></script>
  </head>
  <!-- The body is the visible page -->
  <body>
    <!-- Load my sketch, which has the setup() and draw() functions -->
    <script src="sketch.js"></script>
  </body>
</html>
